x-api-environment: &api-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3001
  LOG_LEVEL: info
  DATABASE_URL: postgresql://mootz:${POSTGRES_PASSWORD:?Set a new hex database password}@db:5432/mootz
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set frontend HTTPS origins}
  PRIVY_APP_ID: ${PRIVY_APP_ID:?Set public Privy app ID}
  PRIVY_VERIFICATION_KEY: ${PRIVY_VERIFICATION_KEY:?Set public verification key}
  WALLET_PROOF_DOMAIN: ${API_DOMAIN:?Set API hostname without scheme}
  WALLET_CHAIN_ID: 10143
  SUPABASE_URL: ${SUPABASE_URL:?Set Supabase HTTPS origin}
  SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set private server storage key}
  SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-mootz-private-media}
  MEET_RPC_URL: ${MEET_RPC_URL:-}
  MEET_REGISTRY_ADDRESS: ${MEET_REGISTRY_ADDRESS:-}
  EVENT_COLLECTION_RPC_URL: ${EVENT_COLLECTION_RPC_URL:-}
  EVENT_COLLECTION_ADDRESS: ${EVENT_COLLECTION_ADDRESS:-}
  EVENT_CLAIM_ISSUER_PRIVATE_KEY: ${EVENT_CLAIM_ISSUER_PRIVATE_KEY:-}

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: mootz
      POSTGRES_USER: mootz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mootz -d mootz"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
  api:
    image: mootz-backend:${MOOTZ_IMAGE_TAG:-vps}
    build: { context: ../.. }
    restart: unless-stopped
    environment: *api-environment
    depends_on: { db: { condition: service_healthy } }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  migrate:
    image: mootz-backend:${MOOTZ_IMAGE_TAG:-vps}
    profiles: [tools]
    environment: *api-environment
    command: [node, dist/db/cli.js, migrate]
    depends_on: { db: { condition: service_healthy } }
    logging: *logging
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API hostname}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: { api: { condition: service_healthy } }
    logging: *logging

volumes:
  postgres:
  caddy_data:
  caddy_config:
